spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tripline}
    username: ${DATABASE_USERNAME:tripline}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        name: TRIPLINE_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
tripline:
  origin: ${SITE_ORIGIN:http://localhost:3000}
  bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
  bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  turnstile-secret: ${TURNSTILE_SECRET_KEY:}
  turnstile-hostname: ${TURNSTILE_EXPECTED_HOSTNAME:localhost}
  r2-endpoint: ${R2_ENDPOINT:}
  r2-key: ${R2_ACCESS_KEY_ID:}
  r2-secret: ${R2_SECRET_ACCESS_KEY:}
  r2-bucket: ${R2_BUCKET:tripline-media}
  r2-public-url: ${R2_PUBLIC_BASE_URL:}
